name: Build ShiWise Android APK
on:
  push:
    branches: [ShiWise-android]
    paths: ['ShiWise/**', '.github/workflows/build-shiwise-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiWise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/setup-android-widgets.mjs
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure permanent release signing
        env:
          SHIWISE_KEYSTORE_BASE64: ${{ secrets.SHIWISE_KEYSTORE_BASE64 }}
          SHIWISE_KEYSTORE_PASSWORD: ${{ secrets.SHIWISE_KEYSTORE_PASSWORD }}
          SHIWISE_KEY_ALIAS: ${{ secrets.SHIWISE_KEY_ALIAS }}
          SHIWISE_KEY_PASSWORD: ${{ secrets.SHIWISE_KEY_PASSWORD }}
          SHIWISE_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/configure-android-signing.mjs
      - name: Build signed release APK
        working-directory: ShiWise/android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ShiWise-release-apk
          path: ShiWise/android/app/build/outputs/apk/release/app-release.apk

# Persistent signing configured
