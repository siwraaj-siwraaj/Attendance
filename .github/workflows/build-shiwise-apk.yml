name: Build ShiWise Android APK
on:
  push:
    branches: [ShiWise-android]
    paths: ['ShiWise/**', '.github/workflows/build-shiwise-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiWise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/setup-android-widgets.mjs
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: ShiWise/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShiWise-debug-apk
          path: ShiWise/android/app/build/outputs/apk/debug/app-debug.apk

# Build trigger marker
