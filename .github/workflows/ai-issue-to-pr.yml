name: AI Issue to PR

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  issue-automation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OpenAI API connection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          response_code=$(curl -sS -o /tmp/openai-response.json -w "%{http_code}" \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY")

          echo "OpenAI HTTP status: $response_code"

          if [ "$response_code" -lt 200 ] || [ "$response_code" -ge 300 ]; then
            echo "OpenAI API request failed."
            cat /tmp/openai-response.json
            exit 1
          fi

          echo "OpenAI API connection successful."
