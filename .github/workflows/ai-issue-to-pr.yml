name: AI Issue to PR

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  issue-automation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask AI for a code-change proposal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          response=$(curl -sS https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n \
              --arg title "$ISSUE_TITLE" \
              --arg body "$ISSUE_BODY" \
              '{
                model: "gpt-5.6-luna",
                input: ("You are reviewing a software issue. Do NOT modify files. Based on the issue below, propose what code should be changed. Give a concise plan with likely file names and what should change. Issue title: " + $title + " Issue body: " + $body)
              }')")

          echo "AI code-change proposal:"
          echo "$response" | jq -r '.output[0].content[0].text // .error.message // "No response text returned."'
