
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.ignore-scripts=false

      - name: Build frontend
        working-directory: src/frontend
        env:
          CANISTER_ID_BACKEND: bkyz2-fmaaa-aaaaa-qaaaq-cai
        run: pnpm build

      - name: Sync Capacitor Android
        working-directory: src/frontend
        run: pnpm exec cap sync android

      - name: Build APK
        working-directory: src/frontend/android
        env:
          ATTENDANCE_KEYSTORE_PASSWORD: ${{ secrets.ATTENDANCE_KEYSTORE_PASSWORD }}
          ATTENDANCE_KEY_ALIAS: ${{ secrets.ATTENDANCE_KEY_ALIAS }}
          ATTENDANCE_KEY_PASSWORD: ${{ secrets.ATTENDANCE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ATTENDANCE_KEYSTORE_BASE64 }}" | base64 --decode > attendance-release.keystore
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-debug-apk
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk

# Rebuild trigger to refresh the downloadable APK artifact.
