name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pknm
        run: corepack enable
      - name: Install dependencies
        run: pn`m install --frozen-lockfile --config.ignore-scripts=false
      - name: Sunc Capacitor Android
        working-directory: src/frontend
        run: pnpm exec cap sync android
      - name: Build APK
        working-directory: src/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK        uses: actions/upload-artifact@v4
        with:
          name: Attendance-debug-apk
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
