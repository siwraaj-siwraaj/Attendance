name: Build APK

on:
  push:
    branches: [main, rossie-fresh-design]
  workflow_dispatch:

# Keep only the newest APK build for main. If a new commit is pushed while
# an older build is running, GitHub Actions cancels the older run.
# Firebase Android config is injected from FIREBASE_GOOGLE_SERVICES_JSON.
concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.ignore-scripts=false

      - name: Build frontend
        working-directory: src/frontend
        env:
          CANISTER_ID_BACKEND: bkyz2-fmaaa-aaaaa-qaaaq-cai
        run: pnpm build

      - name: Configure Firebase Android
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > src/frontend/android/app/google-services.json
            echo "Firebase Android configuration injected."
          else
            echo "Firebase Android configuration secret is not set; APK will build without FCM registration."
          fi

      - name: Sync Capacitor Android
        working-directory: src/frontend
        run: pnpm exec cap sync android

      - name: Build APK
        working-directory: src/frontend/android
        env:
          ATTENDANCE_KEYSTORE_PASSWORD: ${{ secrets.ATTENDANCE_KEYSTORE_PASSWORD }}
          ATTENDANCE_KEY_ALIAS: ${{ secrets.ATTENDANCE_KEY_ALIAS }}
          ATTENDANCE_KEY_PASSWORD: ${{ secrets.ATTENDANCE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ATTENDANCE_KEYSTORE_BASE64 }}" | base64 --decode > attendance-release.keystore
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-debug-apk
          path: src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
