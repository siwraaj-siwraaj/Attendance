name: "AI Pull Request Reviewer"

on:
  pull_request:
    types: [opened, synchronize] # Runs when a PR is opened or new code is pushed

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required so the AI can post comments on the PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ChatGPT Code Review
        # Using a popular, verified marketplace action for OpenAI PR reviews
        uses: villesau/ai-code-review-action@v2.7.0 
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
          model: "gpt-4o" # You can use gpt-4o, gpt-4, or gpt-3.5-turbo
          exclude: "*.md,*.json,lockfiles/" # Optional: Skip files you don't want reviewed
          
