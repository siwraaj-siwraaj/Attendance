<!DOCTYPE html>
<html lang="en" style="background:#040913; color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040913" />
    <meta name="color-scheme" content="dark" />
    <title>Rossie</title>
    <meta name="description" content="Rossie — Attendance &amp; Salary Manager. Manage labour contracts, attendance, advances, and salary payments." />
    <meta property="og:title" content="Rossie" />
    <meta property="og:description" content="Rossie — Attendance &amp; Salary Manager. Manage labour contracts, attendance, advances, and salary payments." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./src/rossie-tabs-redesign.css" />
    <link rel="stylesheet" href="./src/rossie-global-layout.css" />
    <link rel="stylesheet" href="./src/rossie-dialog-fix.css" />
    <link rel="stylesheet" href="./src/rossie-pdf-preview-fix.css" />
  </head>
  <body style="margin:0; min-height:100%; background:#040913; color-scheme:dark;">
    <div id="root"></div>
    <script>
      // PDF preview is a document viewer, not an app-tab swipe surface.
      // Stop the Layout touch handlers from receiving only this preview's
      // touch sequence while leaving native vertical scrolling and clicks intact.
      (function () {
        var pdfTouchActive = false;
        function isPdfTarget(target) {
          return target instanceof Element && !!target.closest('[class~="z-[9999]"]');
        }
        document.addEventListener('touchstart', function (event) {
          if (isPdfTarget(event.target)) {
            pdfTouchActive = true;
            event.stopPropagation();
          }
        }, true);
        document.addEventListener('touchmove', function (event) {
          if (pdfTouchActive) event.stopPropagation();
        }, true);
        document.addEventListener('touchend', function (event) {
          if (pdfTouchActive) {
            event.stopPropagation();
            pdfTouchActive = false;
          }
        }, true);
        document.addEventListener('touchcancel', function (event) {
          if (pdfTouchActive) {
            event.stopPropagation();
            pdfTouchActive = false;
          }
        }, true);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
