<!DOCTYPE html>
<html lang="en" style="background:#040913; color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040913" />
    <meta name="color-scheme" content="dark" />
    <title>Rossie</title>
    <meta name="description" content="Rossie — Attendance &amp; Salary Manager. Manage labour contracts, attendance, advances, and salary payments." />
    <meta property="og:title" content="Rossie" />
    <meta property="og:description" content="Rossie — Attendance &amp; Salary Manager. Manage labour contracts, attendance, advances, and salary payments." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./src/rossie-tabs-redesign.css" />
    <link rel="stylesheet" href="./src/rossie-global-layout.css" />
    <link rel="stylesheet" href="./src/rossie-dialog-fix.css" />
    <link rel="stylesheet" href="./src/rossie-pdf-preview-fix.css" />
  </head>
  <body style="margin:0; min-height:100%; background:#040913; color-scheme:dark;">
    <div id="root"></div>
    <script>
      // PDF preview is a separate document-viewer surface. Mark the actual
      // overlay with the same data attribute understood by Layout.tsx so the
      // app-tab swipe recognizer is blocked without intercepting the browser's
      // native scrolling/click handling inside the PDF viewer.
      (function () {
        function getPdf() {
          return document.querySelector('[class~="z-[9999]"]');
        }
        function syncPdfState() {
          var pdf = getPdf();
          document.body.classList.toggle('rossie-pdf-open', !!pdf);
          if (pdf) pdf.setAttribute('data-pdf-preview', 'true');
        }
        syncPdfState();
        new MutationObserver(syncPdfState).observe(document.documentElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ['class'],
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
